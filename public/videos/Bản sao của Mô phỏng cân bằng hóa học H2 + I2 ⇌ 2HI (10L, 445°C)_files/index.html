   <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4"><button data-template-id="btn-prepare" class="canva-button px-3 py-2.5 rounded-lg font-medium text-sm" onclick="prepare()" style="background-image: linear-gradient(rgb(34, 197, 94), rgb(34, 197, 94)) !important; background-clip: border-box !important; white-space: pre-wrap !important; overflow-wrap: normal !important; line-height: normal !important; color: rgb(255, 255, 255) !important; --canva-color: #ffffffff; caret-color: rgb(255, 255, 255) !important; font-family: YAD1aU3sLnI_0, auto !important; font-weight: 700 !important; font-style: normal !important; font-size: 1rem !important;" data-canva-font-size="1rem"><canva-span style="color: initial">✅</canva-span> Chuẩn bị mẫu</button> <button data-template-id="btn-add-crystal" class="canva-button px-3 py-2.5 rounded-lg font-medium text-sm" onclick="addCrystal()" style="background-image: linear-gradient(rgb(59, 130, 246), rgb(59, 130, 246)) !important; background-clip: border-box !important; white-space: pre-wrap !important; overflow-wrap: normal !important; line-height: normal !important; color: rgb(255, 255, 255) !important; --canva-color: #ffffffff; caret-color: rgb(255, 255, 255) !important; font-family: YAD1aU3sLnI_0, auto !important; font-weight: 700 !important; font-style: normal !important; font-size: 1rem !important;" data-canva-font-size="1rem"><canva-span style="color: initial">🧂</canva-span> Thêm tinh thể vào Ống (2)</button> <button data-template-id="btn-add-acid" class="canva-button px-3 py-2.5 rounded-lg font-medium text-sm" onclick="addAcid()" style="background-image: linear-gradient(rgb(245, 158, 11), rgb(245, 158, 11)) !important; background-clip: border-box !important; white-space: pre-wrap !important; overflow-wrap: normal !important; line-height: normal !important; color: rgb(255, 255, 255) !important; --canva-color: #ffffffff; caret-color: rgb(255, 255, 255) !important; font-family: YAD1aU3sLnI_0, auto !important; font-weight: 700 !important; font-style: normal !important; font-size: 1rem !important;" data-canva-font-size="1rem"><canva-span style="color: initial">💧</canva-span> Nhỏ CH₃COOH vào Ống (3)</button> <button data-template-id="btn-reset" class="canva-button px-3 py-2.5 rounded-lg font-medium text-sm" onclick="resetAll()" style="background-image: linear-gradient(rgb(107, 114, 128), rgb(107, 114, 128)) !important; background-clip: border-box !important; white-space: pre-wrap !important; overflow-wrap: normal !important; line-height: normal !important; color: rgb(255, 255, 255) !important; --canva-color: #ffffffff; caret-color: rgb(255, 255, 255) !important; font-family: YAD1aU3sLnI_0, auto !important; font-weight: 700 !important; font-style: normal !important; font-size: 1rem !important;" data-canva-font-size="1rem"><canva-span style="color: initial">🔄</canva-span> Đặt lại</button>
   </div><!-- Status -->
   <p data-template-id="status-text" id="status-text" class="canva-text text-center text-sm font-medium mb-4" style="color: rgb(251, 191, 36) !important; --canva-color: #fbbf24ff; caret-color: rgb(251, 191, 36) !important; font-weight: 500 !important; font-style: normal !important;">Nhấn "Chuẩn bị" để bắt đầu thí nghiệm.</p><!-- Sound toggle -->
   <div class="flex items-center gap-2 justify-center mb-4"><button id="sound-toggle" class="p-2 rounded-lg bg-white/10 hover:bg-white/20" onclick="toggleSound()"> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="volume-2" style="width:18px;height:18px;color:#e2e8f0;" class="lucide lucide-volume-2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg> </button> <span data-template-id="sound-label" class="canva-text text-xs" data-canva-font-size="1rem" style="white-space: pre-wrap !important; overflow-wrap: normal !important; line-height: normal !important; color: rgb(148, 163, 184) !important; --canva-color: #94a3b8ff; caret-color: rgb(148, 163, 184) !important; font-family: YAD1aU3sLnI_0, auto !important; font-weight: 400 !important; font-style: normal !important; font-size: 1rem !important;">Âm thanh</span> <button id="music-toggle" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 ml-3" onclick="toggleMusic()"> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="music" style="width:18px;height:18px;color:#e2e8f0;" class="lucide lucide-music"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg> </button> <span data-template-id="music-label" class="canva-text text-xs" data-canva-font-size="1rem" style="white-space: pre-wrap !important; overflow-wrap: normal !important; line-height: normal !important; color: rgb(148, 163, 184) !important; --canva-color: #94a3b8ff; caret-color: rgb(148, 163, 184) !important; font-family: YAD1aU3sLnI_0, auto !important; font-weight: 400 !important; font-style: normal !important; font-size: 1rem !important;">Nhạc nền</span>
   </div>
  </div>
  <script src="./editing_sdk.js.download"></script>
  <script>
    lucide.createIcons();

    let prepared = false;
    let tube2Done = false;
    let tube3Done = false;
    let soundEnabled = true;
    let musicEnabled = false;
    let audioCtx;
    let musicInterval = null;

    const PINK_LIGHT = 'rgba(244,114,182,0.35)';
    const PINK_DEEP = 'rgba(190,24,93,0.75)';
    const TRANSPARENT = 'rgba(200,200,200,0.05)';

    function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    function playTone(freq, duration, type='sine', vol=0.08) {
        if (!soundEnabled) return;
        const ac = getAudioCtx();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
        osc.connect(gain); gain.connect(ac.destination);
        osc.start(); osc.stop(ac.currentTime + duration);
    }

    function playWaterPour() {
        if (!soundEnabled) return;
        for (let i = 0; i < 10; i++) {
            setTimeout(() => playTone(700 + Math.random()*500, 0.07, 'sine', 0.03), i * 50);
        }
    }

    function playCrystalDrop() {
        if (!soundEnabled) return;
        for (let i = 0; i < 6; i++) {
            setTimeout(() => playTone(2000 + Math.random()*1500, 0.04, 'square', 0.03), i * 80);
        }
    }

    function playTing() {
        if (!soundEnabled) return;
        playTone(1200, 0.3, 'sine', 0.1);
        setTimeout(() => playTone(1600, 0.2, 'sine', 0.07), 150);
    }

    function playDroplet() {
        if (!soundEnabled) return;
        [0, 300, 600].forEach(d => setTimeout(() => {
            playTone(600, 0.15, 'sine', 0.06);
            setTimeout(() => playTone(400, 0.1, 'sine', 0.04), 50);
        }, d));
    }

    function playGlassReset() {
        if (!soundEnabled) return;
        playTone(800, 0.08, 'triangle', 0.05);
        setTimeout(() => playTone(600, 0.1, 'triangle', 0.04), 100);
        setTimeout(() => playTone(1000, 0.06, 'triangle', 0.03), 200);
    }

    // Background music - simple pentatonic melody
    function startMusic() {
        if (musicInterval) return;
        const notes = [523, 587, 659, 784, 880, 784, 659, 587];
        let idx = 0;
        musicInterval = setInterval(() => {
            if (!musicEnabled) return;
            const ac = getAudioCtx();
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sine';
            osc.frequency.value = notes[idx % notes.length];
            gain.gain.setValueAtTime(0.02, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
            osc.connect(gain); gain.connect(ac.destination);
            osc.start(); osc.stop(ac.currentTime + 0.4);
            idx++;
        }, 500);
    }

    function stopMusic() {
        if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
    }

    function setLiquid(id, color) {
        document.getElementById(id).style.backgroundColor = color;
    }

    function setBars(reactant, product) {
        document.getElementById('bar-reactant').style.width = reactant + '%';
        document.getElementById('bar-product').style.width = product + '%';
    }

    function setTooltips() {
        document.getElementById('tooltip-1').textContent = 'Ống đối chứng – không thay đổi';
        document.getElementById('tooltip-2').textContent = tube2Done ? 'CB dịch chuyển chiều thuận do tăng [CH₃COO⁻] → tăng [OH⁻] → hồng đậm' : '';
        document.getElementById('tooltip-3').textContent = tube3Done ? 'CB dịch chuyển chiều nghịch do tăng [CH₃COOH] → giảm [OH⁻] → mất màu' : '';
    }

    function prepare() {
        prepared = true; tube2Done = false; tube3Done = false;
        setLiquid('tube1-liquid', 'transparent');
        setLiquid('tube2-liquid', 'transparent');
        setLiquid('tube3-liquid', 'transparent');
        setBars(50, 50);
        document.getElementById('spoon').classList.remove('pour');
        document.getElementById('dropper').classList.remove('squeeze');
        setTooltips();
        playWaterPour();

        setTimeout(() => {
            setLiquid('tube1-liquid', PINK_LIGHT);
            setLiquid('tube2-liquid', PINK_LIGHT);
            setLiquid('tube3-liquid', PINK_LIGHT);
            document.getElementById('status-text').textContent = '✅ Dung dịch CH₃COONa + phenolphthalein có màu hồng nhạt. Sẵn sàng thao tác!';
        }, 900);
    }

    function addCrystal() {
        if (!prepared) { document.getElementById('status-text').textContent = '⚠️ Hãy nhấn "Chuẩn bị" trước!'; return; }
        if (tube2Done) return;
        tube2Done = true;

        // Spoon animation
        const spoon = document.getElementById('spoon');
        spoon.classList.add('pour');
        playCrystalDrop();

        // Crystal particles
        const container = document.getElementById('crystal-container');
        for (let i = 0; i < 8; i++) {
            setTimeout(() => {
                const c = document.createElement('div');
                c.className = 'crystal';
                c.style.left = (Math.random() * 30 + 5) + 'px';
                c.style.animationDelay = (Math.random() * 0.3) + 's';
                container.appendChild(c);
                setTimeout(() => c.remove(), 1500);
            }, i * 100);
        }

        setTimeout(() => {
            setLiquid('tube2-liquid', PINK_DEEP);
            setBars(75, 35);
            playTing();
            spoon.classList.remove('pour');
            setTooltips();
            document.getElementById('status-text').textContent = '🧪 Thêm CH₃COONa → Tăng [CH₃COO⁻] → CB dịch chiều thuận → Tăng [OH⁻] → Màu hồng đậm!';
        }, 1500);
    }

    function addAcid() {
        if (!prepared) { document.getElementById('status-text').textContent = '⚠️ Hãy nhấn "Chuẩn bị" trước!'; return; }
        if (tube3Done) return;
        tube3Done = true;

        const dropper = document.getElementById('dropper');
        dropper.classList.add('squeeze');
        playDroplet();

        // Drop particles
        const container = document.getElementById('drop-container');
        [0, 350, 700].forEach((d, i) => {
            setTimeout(() => {
                const drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = (6 + Math.random() * 4) + 'px';
                container.appendChild(drop);
                setTimeout(() => drop.remove(), 1000);
            }, d);
        });

        setTimeout(() => {
            setLiquid('tube3-liquid', TRANSPARENT);
            setBars(50, 75);
            dropper.classList.remove('squeeze');
            setTooltips();
            document.getElementById('status-text').textContent = '💧 Thêm CH₃COOH → Tăng [CH₃COOH] → CB dịch chiều nghịch → Giảm [OH⁻] → Mất màu!';
        }, 1800);
    }

    function resetAll() {
        prepared = false; tube2Done = false; tube3Done = false;
        setLiquid('tube1-liquid', 'transparent');
        setLiquid('tube2-liquid', 'transparent');
        setLiquid('tube3-liquid', 'transparent');
        setBars(50, 50);
        document.getElementById('spoon').classList.remove('pour');
        document.getElementById('dropper').classList.remove('squeeze');
        document.getElementById('tooltip-1').textContent = '';
        document.getElementById('tooltip-2').textContent = '';
        document.getElementById('tooltip-3').textContent = '';
        document.getElementById('status-text').textContent = 'Nhấn "Chuẩn bị" để bắt đầu thí nghiệm.';
        playGlassReset();
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.querySelector('#sound-toggle i').setAttribute('data-lucide', soundEnabled ? 'volume-2' : 'volume-x');
        lucide.createIcons();
    }

    function toggleMusic() {
        musicEnabled = !musicEnabled;
        if (musicEnabled) { startMusic(); }
        else { stopMusic(); }
        document.querySelector('#music-toggle i').setAttribute('data-lucide', musicEnabled ? 'music' : 'music-2');
        lucide.createIcons();
    }

    document.getElementById('status-text').textContent = 'Nhấn "Chuẩn bị" để bắt đầu thí nghiệm.';
    </script>
 
</body></html>
